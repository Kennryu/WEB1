<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="민성이의 하루 엠블럼">
  <title>민성이의 하루 엠블럼</title>
  <defs>
    <path id="top" d="M 30 100 A 70 70 0 0 1 170 100"/>
    <path id="bottom" d="M 26 100 A 74 74 0 0 0 174 100"/>
    <linearGradient id="heart" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff7a8a"/>
      <stop offset="1" stop-color="#e0344f"/>
    </linearGradient>
  </defs>

  <!-- 바깥 테두리 -->
  <circle cx="100" cy="100" r="96" fill="#e0344f"/>
  <circle cx="100" cy="100" r="90" fill="#fff6ec"/>
  <circle cx="100" cy="100" r="58" fill="none" stroke="#e0344f" stroke-width="1.5" stroke-dasharray="2 4"/>

  <!-- 글자 -->
  <text font-family="'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="17" font-weight="700" fill="#b02039" letter-spacing="3">
    <textPath href="#top" startOffset="50%" text-anchor="middle">민성이의 하루</textPath>
  </text>
  <text font-family="'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="13" font-weight="700" fill="#b02039" letter-spacing="2">
    <textPath href="#bottom" startOffset="50%" text-anchor="middle" dominant-baseline="hanging">평화 · 행복 · 사랑</textPath>
  </text>
  <circle cx="24" cy="100" r="3" fill="#e0344f"/>
  <circle cx="176" cy="100" r="3" fill="#e0344f"/>

  <!-- 행복: 햇살 -->
  <g stroke="#ffb627" stroke-width="4" stroke-linecap="round">
    <line x1="100" y1="50" x2="100" y2="60"/>
    <line x1="72" y1="58" x2="77" y2="66"/>
    <line x1="128" y1="58" x2="123" y2="66"/>
    <line x1="52" y1="78" x2="61" y2="82"/>
    <line x1="148" y1="78" x2="139" y2="82"/>
  </g>

  <!-- 평화: 올리브 잎 -->
  <g fill="#5a9e5c">
    <path d="M 66 140 Q 52 120 58 96" fill="none" stroke="#5a9e5c" stroke-width="2.5" stroke-linecap="round"/>
    <ellipse cx="55" cy="104" rx="4" ry="8" transform="rotate(-20 55 104)"/>
    <ellipse cx="54" cy="120" rx="4" ry="8" transform="rotate(-40 54 120)"/>
    <ellipse cx="62" cy="133" rx="4" ry="8" transform="rotate(-60 62 133)"/>
    <path d="M 134 140 Q 148 120 142 96" fill="none" stroke="#5a9e5c" stroke-width="2.5" stroke-linecap="round"/>
    <ellipse cx="145" cy="104" rx="4" ry="8" transform="rotate(20 145 104)"/>
    <ellipse cx="146" cy="120" rx="4" ry="8" transform="rotate(40 146 120)"/>
    <ellipse cx="138" cy="133" rx="4" ry="8" transform="rotate(60 138 133)"/>
  </g>

  <!-- 사랑: 하트 -->
  <path d="M 100 142 C 64 118 66 82 86 80 C 94 79 99 85 100 90 C 101 85 106 79 114 80 C 134 82 136 118 100 142 Z" fill="url(#heart)"/>
  <path d="M 84 90 Q 78 96 80 106" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
</svg>
